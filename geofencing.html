    <!-- Geofence Alert - Purple Theme -->
    <div id="geofence-alert">
        <i class="fas fa-shield-alt" style="font-size: 48px;"></i>
        <div class="alert-content">
            <h3>⚠️ जियोफेंस अलर्ट</h3>
            <p id="alertMessage">आप सुरक्षित मार्ग से बाहर जा रहे हैं!</p>
        </div>
        <div class="alert-progress"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner-large"></div>
    </div>

    <script>
        // Configuration
        const MAPBOX_TOKEN = 'pk.eyJ1IjoicHJhbmphbG1haXRoYW5pIiwiYSI6ImNtbXZvajcwajAxeGcyb3M0em85YWJlc2QifQ.WosjZQ6bGxv8_S8ue0sNeA';
        const API_BASE_URL = 'https://tourist-server-foki.onrender.com/api/crowd';

        mapboxgl.accessToken = MAPBOX_TOKEN;

        // Global Variables
        let map;
        let origin = null;
        let destination = null;
        let routes = [];
        let selectedRouteIndex = 0;
        let markers = [];
        let cameraMarkers = [];
        let cameraData = [];
        let destinationHeatMarkers = [];
        let userMarker = null;
        let watchId = null;
        let isTracking = false;
        let isGeofenceActive = false;
        let geofenceLayer = null;
        let currentRoute = null;
        let refreshInterval;
        let lastKnownPosition = null;
        let currentSpeed = 0;
        let navigationActive = false;
        let sidebarMinimized = false;

        // Known Uttarakhand locations for camera mapping
        const locationCoords = {
            'chopta': [79.3165, 30.4865],
            'tunganath': [79.3265, 30.4965],
            'kedarnath': [79.0669, 30.7346],
            'badrinath': [79.4937, 30.7433],
            'gangotri': [78.9397, 30.9944],
            'yamunotri': [78.4636, 31.0167],
            'haridwar': [78.1633, 29.9457],
            'rishikesh': [78.2673, 30.0869],
            'auli': [79.6189, 30.5331],
            'nainital': [79.4472, 29.3919],
            'mussoorie': [78.0707, 30.4598],
            'jim corbett': [78.7758, 29.5300]
        };

        // Initialize Map
        window.onload = function() {
            initMap();
            setupEventListeners();
            loadCameraData();
            refreshInterval = setInterval(loadCameraData, 10000); // Update every 10 seconds
        };

        window.addEventListener('beforeunload', () => {
            clearInterval(refreshInterval);
            if (watchId) navigator.geolocation.clearWatch(watchId);
        });

        function initMap() {
            map = new mapboxgl.Map({ 
                container: 'map', 
                style: 'mapbox://styles/mapbox/streets-v12', 
                center: [79.0882, 30.3165], 
                zoom: 7.5,
                pitch: 45,
                bearing: 0
            });
            
            map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
            
            map.on('load', function() {
                console.log('Map loaded successfully');
                
                // Add heatmap source for crowd visualization
                map.addSource('crowd-heat', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: []
                    }
                });

                map.addLayer({
                    id: 'crowd-heat-layer',
                    type: 'heatmap',
                    source: 'crowd-heat',
                    maxzoom: 15,
                    paint: {
                        'heatmap-weight': [
                            'interpolate',
                            ['linear'],
                            ['get', 'count'],
                            0, 0,
                            50, 0.3,
                            100, 0.6,
                            200, 1
                        ],
                        'heatmap-intensity': 0.8,
                        'heatmap-color': [
                            'interpolate',
                            ['linear'],
                            ['heatmap-density'],
                            0, 'rgba(16, 185, 129, 0)',
                            0.2, 'rgba(16, 185, 129, 0.6)',
                            0.4, 'rgba(249, 166, 26, 0.6)',
                            0.6, 'rgba(249, 166, 26, 0.8)',
                            0.8, 'rgba(239, 68, 68, 0.8)',
                            1, 'rgba(239, 68, 68, 1)'
                        ],
                        'heatmap-radius': 25,
                        'heatmap-opacity': 0.6
                    }
                });

                // Add route source for better highlighting
                map.addSource('routes', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: []
                    }
                });

                map.addLayer({
                    id: 'routes-layer',
                    type: 'line',
                    source: 'routes',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': ['get', 'color'],
                        'line-width': ['get', 'width'],
                        'line-opacity': 0.8,
                        'line-blur': 1
                    }
                });
            });
        }

        // Load Camera Data from API
        async function loadCameraData() {
            try {
                const response = await fetch(`${API_BASE_URL}/all-stats`);
                if (!response.ok) throw new Error('API response not OK');
                
                const data = await response.json();
                
                if (data.success && data.data) {
                    cameraData = data.data;
                    updateCameraList();
                    updateCameraMarkers();
                    updateHeatmap();
                    
                    // Update destination heat if destination exists
                    if (destination) {
                        showDestinationHeatByKeyword(destination.name);
                    }
                } else {
                    showError('Invalid API response format');
                }
            } catch (error) {
                console.error('API Error:', error);
                // Use mock data for demonstration
                useMockData();
            }
        }

        function useMockData() {
            cameraData = [
                { cameraName: 'Chopta Gate Entrance', location: 'Chopta Main Gate', liveCount: 1, totalCount: 71, remainingCount: 71, lastUpdated: new Date().toISOString() },
                { cameraName: 'Rishikesh Bridge', location: 'Rishikesh', liveCount: 245, totalCount: 1200, remainingCount: 890, lastUpdated: new Date().toISOString() },
                { cameraName: 'Haridwar Gate', location: 'Haridwar', liveCount: 412, totalCount: 3000, remainingCount: 1700, lastUpdated: new Date().toISOString() },
                { cameraName: 'Kedarnath Ji', location: 'Kedarnath', liveCount: 78, totalCount: 620, remainingCount: 320, lastUpdated: new Date().toISOString() },
                { cameraName: 'Badrinath Temple', location: 'Badrinath', liveCount: 156, totalCount: 850, remainingCount: 480, lastUpdated: new Date().toISOString() }
            ];
            
            updateCameraList();
            updateCameraMarkers();
            updateHeatmap();
        }

        function showError(message) {
            document.getElementById('cameraList').innerHTML = `
                <div style="text-align:center;padding:20px;color:#ef4444;">
                    <i class="fas fa-exclamation-circle"></i> ${message}
                </div>
            `;
        }

        function getCrowdStatus(remaining) {
            if (remaining >= 100) return { level: 'high', label: 'अत्यधिक भीड़', color: '#ef4444' };
            if (remaining >= 50) return { level: 'medium', label: 'भीड़', color: '#f9a61a' };
            return { level: 'low', label: 'सामान्य', color: '#10b981' };
        }

        function updateCameraList() {
            const list = document.getElementById('cameraList');
            
            if (!cameraData || cameraData.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">कोई डेटा नहीं</div>';
                return;
            }

            list.innerHTML = cameraData.map(cam => {
                const crowd = getCrowdStatus(cam.remainingCount || 0);
                // Extract place name from camera name
                let placeName = cam.cameraName.replace(/Camera|Gate|Entrance|Temple|Bridge|Main|Parking|Viewpoint/gi, '').trim();
                if (!placeName) placeName = cam.location || 'उत्तराखंड';
                
                const updateTime = cam.lastUpdated ? new Date(cam.lastUpdated).toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' }) : 'अज्ञात';
                
                return `
                    <div class="camera-card ${crowd.level}" onclick="flyToCamera('${cam.cameraName}')">
                        <div class="place-header">
                            <span class="place-name"><i class="fas fa-map-marker-alt" style="color: ${crowd.color};"></i> ${placeName}</span>
                            <span class="place-badge">${cam.location || 'उत्तराखंड'}</span>
                        </div>
                        <div class="crowd-numbers">
                            <div class="number-item">
                                <div class="number-value" style="color: #3b82f6;">${cam.liveCount || 0}</div>
                                <div class="number-label">नया</div>
                            </div>
                            <div class="number-item">
                                <div class="number-value" style="color: #f59e0b;">${cam.totalCount || 0}</div>
                                <div class="number-label">कुल</div>
                            </div>
                            <div class="number-item">
                                <div class="number-value" style="color: #10b981;">${cam.remainingCount || 0}</div>
                                <div class="number-label">अंदर</div>
                            </div>
                        </div>
                        <div class="crowd-status ${crowd.level}">
                            <i class="fas ${crowd.level === 'high' ? 'fa-exclamation-triangle' : crowd.level === 'medium' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i>
                            ${crowd.label}
                        </div>
                        <div class="update-time">
                            <i class="far fa-clock"></i> अपडेट: ${updateTime}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.flyToCamera = function(cameraName) {
            const cam = cameraData.find(c => c.cameraName === cameraName);
            if (cam) {
                const coords = getCameraCoordinates(cam);
                if (coords) {
                    map.flyTo({ center: coords, zoom: 14, essential: true });
                }
            }
        };

        function getCameraCoordinates(cam) {
            const name = (cam.cameraName + ' ' + (cam.location || '')).toLowerCase();
            
            for (let [key, coords] of Object.entries(locationCoords)) {
                if (name.includes(key)) {
                    return coords;
                }
            }
            
            // Return Dehradun if not found
            return [78.0322, 30.3165];
        }

        function updateCameraMarkers() {
            cameraMarkers.forEach(m => m.remove());
            cameraMarkers = [];

            cameraData.forEach(cam => {
                const coords = getCameraCoordinates(cam);
                if (!coords) return;

                const crowd = getCrowdStatus(cam.remainingCount || 0);
                
                const el = document.createElement('div');
                el.style.backgroundColor = crowd.color;
                el.style.width = '35px';
                el.style.height = '35px';
                el.style.borderRadius = '50%';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.color = 'white';
                el.style.cursor = 'pointer';
                el.style.boxShadow = `0 0 20px ${crowd.color}`;
                el.style.border = '3px solid white';
                el.style.fontWeight = 'bold';
                el.style.fontSize = '14px';
                el.innerText = cam.remainingCount || 0;
                
                // Extract place name
                let placeName = cam.cameraName.replace(/Camera|Gate|Entrance|Temple|Bridge|Main|Parking|Viewpoint/gi, '').trim();
                if (!placeName) placeName = cam.location || 'उत्तराखंड';
                
                const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(`
                    <div style="padding: 10px; min-width: 200px;">
                        <h4 style="margin: 0 0 8px 0; color: #1e3c72;">${placeName}</h4>
                        <p style="margin: 5px 0;"><i class="fas fa-map-pin"></i> ${cam.location || 'उत्तराखंड'}</p>
                        <div style="display: flex; justify-content: space-between; margin: 10px 0;">
                            <div><span style="color: #1e3c72; font-weight: 600;">${cam.liveCount || 0}</span><br>नया</div>
                            <div><span style="color: #f9a61a; font-weight: 600;">${cam.totalCount || 0}</span><br>कुल</div>
                            <div><span style="color: #10b981; font-weight: 600;">${cam.remainingCount || 0}</span><br>अंदर</div>
                        </div>
                        <div style="background: ${crowd.color}; color: white; padding: 5px; border-radius: 5px; text-align: center;">
                            ${crowd.label}
                        </div>
                    </div>
                `);

                const marker = new mapboxgl.Marker(el)
                    .setLngLat(coords)
                    .setPopup(popup)
                    .addTo(map);

                cameraMarkers.push(marker);
            });
        }

        function updateHeatmap() {
            if (!map.getSource('crowd-heat')) return;

            const features = cameraData.map(cam => {
                const coords = getCameraCoordinates(cam);
                if (!coords) return null;
                
                return {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: coords
                    },
                    properties: {
                        count: cam.remainingCount || 0,
                        name: cam.cameraName
                    }
                };
            }).filter(f => f !== null);

            map.getSource('crowd-heat').setData({
                type: 'FeatureCollection',
                features: features
            });
        }

        // Show destination heat circle based on keyword match
        function showDestinationHeatByKeyword(destName) {
            // Clear previous destination heat markers
            destinationHeatMarkers.forEach(m => m.remove());
            destinationHeatMarkers = [];

            const lowerDest = destName.toLowerCase();
            
            // Find matching cameras
            const matchedCameras = cameraData.filter(cam => {
                const camName = (cam.cameraName || '').toLowerCase();
                const camLoc = (cam.location || '').toLowerCase();
                
                return camName.includes(lowerDest) || 
                       camLoc.includes(lowerDest) ||
                       Object.keys(locationCoords).some(key => 
                           lowerDest.includes(key) && (camName.includes(key) || camLoc.includes(key))
                       );
            });

            // Show heat circles for matched cameras
            matchedCameras.forEach(cam => {
                const coords = getCameraCoordinates(cam);
                if (!coords || !destination) return;

                const remaining = cam.remainingCount || 0;
                const crowd = getCrowdStatus(remaining);
                
                const heatEl = document.createElement('div');
                heatEl.className = 'heat-circle';
                
                let size = 40 + remaining * 0.3;
                size = Math.min(size, 120);
                
                heatEl.style.width = size + 'px';
                heatEl.style.height = size + 'px';
                heatEl.style.background = `radial-gradient(circle, ${crowd.color}80, ${crowd.color}40)`;
                heatEl.style.border = `3px solid ${crowd.color}`;
                heatEl.style.boxShadow = `0 0 30px ${crowd.color}`;
                heatEl.innerText = remaining;

                const marker = new mapboxgl.Marker({ element: heatEl, anchor: 'center' })
                    .setLngLat(coords)
                    .addTo(map);

                // Extract place name
                let placeName = cam.cameraName.replace(/Camera|Gate|Entrance|Temple|Bridge|Main|Parking|Viewpoint/gi, '').trim();
                if (!placeName) placeName = cam.location || 'उत्तराखंड';

                const popup = new mapboxgl.Popup({ closeButton: false })
                    .setLngLat(coords)
                    .setHTML(`
                        <div style="padding: 5px;">
                            <strong>${placeName}</strong><br>
                            <span style="color: ${crowd.color};">● ${crowd.label}</span><br>
                            <small>अंदर: ${remaining} लोग</small>
                        </div>
                    `);

                marker.setPopup(popup);
                destinationHeatMarkers.push(marker);
            });
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Search inputs
            document.getElementById('origin-search').addEventListener('input', debounce(e => searchPlaces(e.target.value, 'origin'), 500));
            document.getElementById('destination-search').addEventListener('input', debounce(e => searchPlaces(e.target.value, 'destination'), 500));
            
            // Buttons
            document.getElementById('useCurrentLocation').addEventListener('click', useCurrentLocation);
            document.getElementById('find-routes').addEventListener('click', findRoutes);
            document.getElementById('refreshCameras').addEventListener('click', loadCameraData);
            document.getElementById('closeRoutes').addEventListener('click', closeRoutes);
            document.getElementById('geofenceBtn').addEventListener('click', toggleGeofence);
            document.getElementById('toggleTracking').addEventListener('click', toggleTracking);
            document.getElementById('closeNav').addEventListener('click', closeNavigation);
            document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
            
            // Map controls
            document.getElementById('zoomIn').addEventListener('click', () => map.zoomTo(map.getZoom() + 1));
            document.getElementById('zoomOut').addEventListener('click', () => map.zoomTo(map.getZoom() - 1));
            document.getElementById('centerMap').addEventListener('click', centerOnUser);

            // Focus events to clear selections
            document.getElementById('origin-search').addEventListener('focus', () => {
                if (origin) {
                    origin = null;
                    document.getElementById('origin-selected').style.display = 'none';
                    document.getElementById('origin-search').value = '';
                    clearMarkers();
                    updateFindRoutes();
                }
            });

            document.getElementById('destination-search').addEventListener('focus', () => {
                if (destination) {
                    destination = null;
                    document.getElementById('destination-selected').style.display = 'none';
                    document.getElementById('destination-search').value = '';
                    clearMarkers();
                    updateFindRoutes();
                    destinationHeatMarkers.forEach(m => m.remove());
                    destinationHeatMarkers = [];
                }
            });

            // Close suggestions on outside click
            document.addEventListener('click', e => {
                if (!e.target.closest('#origin-search') && !e.target.closest('#origin-suggestions') && !e.target.closest('#useCurrentLocation')) {
                    document.getElementById('origin-suggestions').style.display = 'none';
                }
                if (!e.target.closest('#destination-search') && !e.target.closest('#destination-suggestions')) {
                    document.getElementById('destination-suggestions').style.display = 'none';
                }
            });
        }

        function debounce(fn, delay) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        // Search Places using Mapbox API
        async function searchPlaces(query, type) {
            if (query.length < 3) return;
            
            try {
                const response = await fetch(
                    `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?` +
                    `access_token=${MAPBOX_TOKEN}&autocomplete=true&limit=5&country=IN&proximity=78.0322,30.3165`
                );
                
                const data = await response.json();
                if (data.features) showSuggestions(data.features, type);
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        function showSuggestions(places, type) {
            const div = document.getElementById(`${type}-suggestions`);
            div.innerHTML = '';
            
            places.forEach(place => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.innerHTML = `
                    <div class="suggestion-name">${place.text}</div>
                    <div class="suggestion-address">${place.place_name}</div>
                `;
                item.onclick = () => selectPlace(place, type);
                div.appendChild(item);
            });
            
            div.style.display = 'block';
        }

        function selectPlace(place, type) {
            const placeData = {
                name: place.place_name,
                text: place.text,
                coordinates: place.center
            };

            if (type === 'origin') {
                origin = placeData;
                document.getElementById('origin-search').value = place.place_name;
                document.getElementById('origin-name').innerText = place.place_name;
                document.getElementById('origin-selected').style.display = 'flex';
                addMarker(place.center, 'origin');
            } else {
                destination = placeData;
                document.getElementById('destination-search').value = place.place_name;
                document.getElementById('destination-name').innerText = place.place_name;
                document.getElementById('destination-selected').style.display = 'flex';
                addMarker(place.center, 'destination');
                
                // Show heat circles for matching cameras
                showDestinationHeatByKeyword(place.place_name);
            }

            document.getElementById(`${type}-suggestions`).style.display = 'none';
            map.flyTo({ center: place.center, zoom: 12, essential: true });
            updateFindRoutes();
        }

        function addMarker(coord, type) {
            const color = type === 'origin' ? '#10b981' : '#ef4444';
            const marker = new mapboxgl.Marker({ color })
                .setLngLat(coord)
                .addTo(map);
            markers.push(marker);
        }

        function clearMarkers() {
            markers.forEach(m => m.remove());
            markers = [];
        }

        function updateFindRoutes() {
            document.getElementById('find-routes').disabled = !(origin && destination);
        }

        function closeRoutes() {
            document.getElementById('routes-container').style.display = 'none';
            // Clear routes from map
            if (map.getLayer('routes-layer')) map.removeLayer('routes-layer');
            if (map.getSource('routes')) map.removeSource('routes');
            routes = [];
        }

        function closeNavigation() {
            document.getElementById('navigation-panel').classList.remove('active');
            navigationActive = false;
        }

        function toggleSidebar() {
            sidebarMinimized = !sidebarMinimized;
            document.getElementById('sidebar').classList.toggle('minimized', sidebarMinimized);
            const icon = document.querySelector('.sidebar-toggle i');
            if (sidebarMinimized) {
                icon.className = 'fas fa-chevron-right';
            } else {
                icon.className = 'fas fa-chevron-left';
            }
        }

        // Use Current Location
        function useCurrentLocation() {
            if (!navigator.geolocation) {
                alert('आपका ब्राउज़र जियोलोकेशन सपोर्ट नहीं करता');
                return;
            }

            showLoading();

            navigator.geolocation.getCurrentPosition(
                position => {
                    const { longitude, latitude } = position.coords;
                    
                    // Reverse geocode to get address
                    fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${longitude},${latitude}.json?access_token=${MAPBOX_TOKEN}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.features && data.features[0]) {
                                origin = {
                                    name: data.features[0].place_name,
                                    coordinates: [longitude, latitude]
                                };
                                
                                document.getElementById('origin-search').value = data.features[0].text || 'मेरी लोकेशन';
                                document.getElementById('origin-name').innerText = data.features[0].place_name;
                                document.getElementById('origin-selected').style.display = 'flex';
                                addMarker([longitude, latitude], 'origin');
                                map.flyTo({ center: [longitude, latitude], zoom: 14 });
                                updateFindRoutes();
                            }
                        })
                        .finally(() => hideLoading());
                },
                error => {
                    console.error('Location error:', error);
                    alert('लोकेशन प्राप्त नहीं हो सकी');
                    hideLoading();
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // Live Tracking Functions
        function toggleTracking() {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        }

        function startTracking() {
            if (!navigator.geolocation) {
                alert('जियोलोकेशन सपोर्ट नहीं है');
                return;
            }

            const btn = document.getElementById('toggleTracking');
            const bar = document.getElementById('liveTrackingBar');
            
            btn.innerHTML = '<i class="fas fa-stop"></i> बंद करें';
            btn.classList.add('active');
            bar.classList.add('active');
            document.getElementById('trackingStatus').innerText = 'ट्रैकिंग चालू';
            isTracking = true;

            // Get initial position
            navigator.geolocation.getCurrentPosition(
                position => {
                    updateUserPosition(position);
                },
                error => console.error('Initial position error:', error),
                { enableHighAccuracy: true }
            );

            // Watch position continuously (updates every 5 seconds)
            watchId = navigator.geolocation.watchPosition(
                position => updateUserPosition(position),
                error => console.error('Tracking error:', error),
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                }
            );
        }

        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (userMarker) {
                userMarker.remove();
                userMarker = null;
            }

            const btn = document.getElementById('toggleTracking');
            const bar = document.getElementById('liveTrackingBar');
            
            btn.innerHTML = '<i class="fas fa-play"></i> शुरू करें';
            btn.classList.remove('active');
            bar.classList.remove('active');
            document.getElementById('trackingStatus').innerText = 'ट्रैकिंग बंद';
            document.getElementById('liveSpeed').innerHTML = '0 <small>km/h</small>';
            isTracking = false;
        }

        function updateUserPosition(position) {
            const { latitude, longitude, speed, heading } = position.coords;
            lastKnownPosition = [longitude, latitude];
            
            // Update speed
            if (speed !== null) {
                currentSpeed = Math.round(speed * 3.6); // Convert m/s to km/h
                document.getElementById('liveSpeed').innerHTML = `${currentSpeed} <small>km/h</small>`;
            }

            // Update or create user marker
            if (userMarker) {
                userMarker.remove();
            }

            // Create custom user marker with direction
            const el = document.createElement('div');
            el.className = 'user-marker';
            
            if (heading !== null) {
                const direction = document.createElement('div');
                direction.className = 'user-direction';
                direction.style.transform = `translateX(-50%) rotate(${heading}deg)`;
                el.appendChild(direction);
            }

            userMarker = new mapboxgl.Marker(el)
                .setLngLat([longitude, latitude])
                .addTo(map);

            // Check geofence if active
            if (isGeofenceActive && currentRoute) {
                checkGeofence([longitude, latitude]);
            }

            // Update navigation panel if active
            if (navigationActive && currentRoute) {
                updateNavigationProgress([longitude, latitude]);
            }
        }

        function centerOnUser() {
            if (lastKnownPosition) {
                map.flyTo({ center: lastKnownPosition, zoom: 15, essential: true });
            }
        }

        // Geofence Functions - Purple Theme
        function toggleGeofence() {
            const btn = document.getElementById('geofenceBtn');
            
            if (!isGeofenceActive) {
                // Activate geofence
                btn.innerHTML = '<i class="fas fa-shield-alt"></i> जियोफेंस सक्रिय ✓';
                btn.classList.add('active', 'protected');
                isGeofenceActive = true;
                
                // If a route is selected, create geofence corridor
                if (currentRoute) {
                    createGeofenceCorridor(currentRoute);
                }
                
                // Show success message
                showGeofenceAlert('✅ जियोफेंस सक्रिय - सुरक्षित मार्ग', '#8b5cf6');
            } else {
                // Deactivate geofence
                btn.innerHTML = '<i class="fas fa-shield-alt"></i> जियोफेंस सुरक्षा सक्रिय करें';
                btn.classList.remove('active', 'protected');
                isGeofenceActive = false;
                
                // Remove geofence layers
                if (map.getLayer('geofence-fill')) map.removeLayer('geofence-fill');
                if (map.getLayer('geofence-border')) map.removeLayer('geofence-border');
                if (map.getSource('geofence')) map.removeSource('geofence');
                geofenceLayer = null;
            }
        }

        function createGeofenceCorridor(route) {
            if (!route || !route.geometry) return;
            
            // Remove existing geofence layers
            if (map.getLayer('geofence-fill')) map.removeLayer('geofence-fill');
            if (map.getLayer('geofence-border')) map.removeLayer('geofence-border');
            if (map.getSource('geofence')) map.removeSource('geofence');

            // Create a buffer around the route (closer to route - 1km)
            const coordinates = route.geometry.coordinates;
            const bufferPoints = [];
            
            // Create a narrow corridor by adding offset points (0.01 degrees ≈ 1km)
            coordinates.forEach(coord => {
                bufferPoints.push([coord[0] + 0.008, coord[1] + 0.008]);
            });
            
            // Add points in reverse order with negative offset
            coordinates.slice().reverse().forEach(coord => {
                bufferPoints.push([coord[0] - 0.008, coord[1] - 0.008]);
            });

            // Add the first point again to close the polygon
            if (coordinates.length > 0) {
                bufferPoints.push([coordinates[0][0] + 0.008, coordinates[0][1] + 0.008]);
            }

            map.addSource('geofence', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    geometry: {
                        type: 'Polygon',
                        coordinates: [bufferPoints]
                    }
                }
            });

            map.addLayer({
                id: 'geofence-fill',
                type: 'fill',
                source: 'geofence',
                paint: {
                    'fill-color': '#8b5cf6',
                    'fill-opacity': 0.15
                }
            });

            map.addLayer({
                id: 'geofence-border',
                type: 'line',
                source: 'geofence',
                paint: {
                    'line-color': '#8b5cf6',
                    'line-width': 3,
                    'line-dasharray': [4, 3]
                }
            });

            geofenceLayer = 'geofence';
        }

        function checkGeofence(userLocation) {
            if (!geofenceLayer || !currentRoute) return;

            // Simple point-in-polygon check
            const routeCoords = currentRoute.geometry.coordinates;
            let minDistance = Infinity;

            routeCoords.forEach(coord => {
                const dist = Math.sqrt(
                    Math.pow(userLocation[0] - coord[0], 2) +
                    Math.pow(userLocation[1] - coord[1], 2)
                );
                minDistance = Math.min(minDistance, dist);
            });

            // Check if user is within 1.5km of the route (tighter corridor)
            const isInCorridor = minDistance <= 0.015; // ~1.5km

            if (!isInCorridor) {
                showGeofenceAlert('⚠️ सावधान! आप सुरक्षित मार्ग से बाहर जा रहे हैं', '#8b5cf6');
                
                // Flash border red temporarily
                if (map.getLayer('geofence-border')) {
                    map.setPaintProperty('geofence-border', 'line-color', '#ef4444');
                    setTimeout(() => {
                        if (isGeofenceActive) {
                            map.setPaintProperty('geofence-border', 'line-color', '#8b5cf6');
                        }
                    }, 3000);
                }
            }
        }

        function showGeofenceAlert(message, color) {
            const alert = document.getElementById('geofence-alert');
            document.getElementById('alertMessage').innerText = message;
            alert.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
            alert.style.display = 'flex';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // Find Routes
        async function findRoutes() {
            if (!origin || !destination) return;
            
            showLoading();
            
            try {
                const originCoords = `${origin.coordinates[0]},${origin.coordinates[1]}`;
                const destCoords = `${destination.coordinates[0]},${destination.coordinates[1]}`;
                
                const url = `https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${originCoords};${destCoords}?alternatives=true&geometries=geojson&overview=full&steps=true&access_token=${MAPBOX_TOKEN}`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.routes && data.routes.length > 0) {
                    routes = data.routes.map((r, i) => ({
                        index: i,
                        distance: (r.distance / 1000).toFixed(1),
                        duration: Math.round(r.duration / 60),
                        geometry: r.geometry,
                        legs: r.legs
                    }));

                    // Sort routes by duration (fastest first)
                    routes.sort((a, b) => a.duration - b.duration);
                    
                    // Set current route to fastest
                    currentRoute = routes[0];
                    
                    displayRoutes();
                    displayRoutesOnMap();
                    fitBoundsToRoutes();
                    document.getElementById('routes-container').style.display = 'block';
                    
                    // Create geofence if active
                    if (isGeofenceActive) {
                        createGeofenceCorridor(currentRoute);
                    }
                } else {
                    alert('कोई रास्ता नहीं मिला');
                }
            } catch (error) {
                console.error('Route error:', error);
                alert('रूट ढूंढने में त्रुटि: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        function displayRoutes() {
            const list = document.getElementById('routes-list');
            list.innerHTML = '';

            routes.forEach((r, i) => {
                const crowd = getRouteCrowdLevel(r);
                const isProtected = isGeofenceActive && i === 0;
                
                const card = document.createElement('div');
                card.className = `route-card ${i === selectedRouteIndex ? 'selected' : ''} ${isProtected ? 'protected' : ''}`;
                
                if (isProtected) {
                    card.innerHTML += `
                        <div class="protected-badge">
                            <i class="fas fa-shield-alt"></i> सुरक्षित मार्ग
                        </div>
                    `;
                }
                
                // Get route summary
                const summary = r.legs && r.legs[0] ? r.legs[0].summary || '' : '';
                
                card.innerHTML += `
                    <div class="route-header">
                        <span class="route-name">रास्ता ${i + 1} ${i === 0 ? '★' : ''}</span>
                        <span class="route-distance">${r.distance} km</span>
                    </div>
                    <div class="route-time">
                        <i class="fas fa-clock"></i> ${formatTime(r.duration)}
                    </div>
                    <div class="route-description">${summary || generateRouteDescription(r)}</div>
                    <div class="route-crowd-indicator" style="background:${crowd.color}20; border-left:3px solid ${crowd.color};">
                        <i class="fas ${crowd.level === 'high' ? 'fa-exclamation-triangle' : crowd.level === 'medium' ? 'fa-exclamation-circle' : 'fa-check-circle'}" style="color:${crowd.color};"></i>
                        <span style="color:${crowd.color};">${crowd.label}</span>
                    </div>
                `;
                
                card.onclick = () => selectRoute(i);
                list.appendChild(card);
            });

            selectRoute(0);
        }

        function generateRouteDescription(r) {
            if (r.legs && r.legs[0] && r.legs[0].steps) {
                const steps = r.legs[0].steps;
                const roads = steps
                    .map(s => s.name)
                    .filter(n => n && n !== '' && n !== '无名道路')
                    .filter((v, i, a) => a.indexOf(v) === i)
                    .slice(0, 2);
                return roads.length ? 'Via ' + roads.join(' → ') : 'सीधा मार्ग';
            }
            return 'सीधा मार्ग';
        }

        function formatTime(minutes) {
            if (minutes < 60) return minutes + ' मिनट';
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return hours + ' घंटा ' + (mins > 0 ? mins + ' मिनट' : '');
        }

        function getRouteCrowdLevel(route) {
            // Estimate crowd based on camera data near the route
            let totalRemaining = 0;
            let cameraCount = 0;

            if (cameraData.length > 0) {
                const sampleSize = Math.min(3, cameraData.length);
                for (let i = 0; i < sampleSize; i++) {
                    const cam = cameraData[Math.floor(Math.random() * cameraData.length)];
                    totalRemaining += cam.remainingCount || 0;
                    cameraCount++;
                }
            }

            if (totalRemaining > 500) return { level: 'high', label: 'उच्च भीड़', color: '#ef4444' };
            if (totalRemaining > 200) return { level: 'medium', label: 'मध्यम भीड़', color: '#f9a61a' };
            return { level: 'low', label: 'कम भीड़', color: '#10b981' };
        }

        function selectRoute(idx) {
            selectedRouteIndex = idx;
            currentRoute = routes[idx];
            
            document.querySelectorAll('.route-card').forEach((c, i) => {
                if (i === idx) c.classList.add('selected');
                else c.classList.remove('selected');
            });
            
            displayRoutesOnMap();
            
            // Update geofence if active
            if (isGeofenceActive) {
                createGeofenceCorridor(currentRoute);
            }
        }

        function displayRoutesOnMap() {
            if (!routes.length) return;
            
            try {
                // Update the routes source
                const features = routes.map((r, i) => ({
                    type: 'Feature',
                    properties: {
                        color: i === selectedRouteIndex ? (isGeofenceActive ? '#8b5cf6' : '#1e3c72') : '#94a3b8',
                        width: i === selectedRouteIndex ? 8 : 4
                    },
                    geometry: r.geometry
                }));

                map.getSource('routes').setData({
                    type: 'FeatureCollection',
                    features: features
                });

                // Ensure layer exists
                if (!map.getLayer('routes-layer')) {
                    map.addLayer({
                        id: 'routes-layer',
                        type: 'line',
                        source: 'routes',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': ['get', 'color'],
                            'line-width': ['get', 'width'],
                            'line-opacity': 0.9,
                            'line-blur': 1
                        }
                    });
                }

                // Add glow effect for protected route
                if (isGeofenceActive && selectedRouteIndex === 0) {
                    // Add a second layer for glow effect
                    if (map.getLayer('route-glow')) map.removeLayer('route-glow');
                    
                    map.addLayer({
                        id: 'route-glow',
                        type: 'line',
                        source: 'routes',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': '#8b5cf6',
                            'line-width': 12,
                            'line-opacity': 0.3,
                            'line-blur': 5
                        },
                        filter: ['==', ['get', 'color'], '#8b5cf6']
                    });
                } else {
                    if (map.getLayer('route-glow')) map.removeLayer('route-glow');
                }
            } catch (error) {
                console.error('Error displaying routes on map:', error);
            }
        }

        function fitBoundsToRoutes() {
            if (!routes.length) return;

            try {
                const bounds = new mapboxgl.LngLatBounds();
                routes.forEach(r => {
                    if (r.geometry && r.geometry.coordinates) {
                        r.geometry.coordinates.forEach(c => bounds.extend(c));
                    }
                });
                map.fitBounds(bounds, { 
                    padding: 50, 
                    duration: 1000, 
                    essential: true,
                    maxZoom: 12
                });
            } catch (error) {
                console.error('Error fitting bounds:', error);
            }
        }

        function updateNavigationProgress(currentPos) {
            if (!currentRoute || !currentRoute.legs || !currentRoute.legs[0]) return;
            
            // Calculate remaining distance
            const routeCoords = currentRoute.geometry.coordinates;
            let minDist = Infinity;
            let nearestIndex = 0;

            routeCoords.forEach((coord, i) => {
                const dist = Math.sqrt(
                    Math.pow(currentPos[0] - coord[0], 2) +
                    Math.pow(currentPos[1] - coord[1], 2)
                );
                if (dist < minDist) {
                    minDist = dist;
                    nearestIndex = i;
                }
            });

            // Calculate remaining distance and time
            const remainingCoords = routeCoords.slice(nearestIndex);
            let remainingDistance = 0;
            for (let i = 0; i < remainingCoords.length - 1; i++) {
                const dist = Math.sqrt(
                    Math.pow(remainingCoords[i+1][0] - remainingCoords[i][0], 2) +
                    Math.pow(remainingCoords[i+1][1] - remainingCoords[i][1], 2)
                );
                remainingDistance += dist * 111; // Rough conversion to km
            }

            const remainingTime = (remainingDistance / (currentSpeed || 30)) * 60; // minutes

            // Update navigation panel
            document.getElementById('navDistance').innerText = remainingDistance.toFixed(1);
            document.getElementById('navTime').innerText = Math.round(remainingTime);

            // Calculate ETA
            const now = new Date();
            const eta = new Date(now.getTime() + remainingTime * 60000);
            document.getElementById('navEta').innerText = eta.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });

            // Start navigation panel if not active
            if (!navigationActive && remainingDistance > 0.1) {
                document.getElementById('navigation-panel').classList.add('active');
                navigationActive = true;
                showInstructions(currentRoute);
            }
        }

        function showInstructions(route) {
            if (!route.legs || !route.legs[0] || !route.legs[0].steps) return;

            const instructions = document.getElementById('instructionList');
            const steps = route.legs[0].steps;

            instructions.innerHTML = steps.map(step => {
                const icon = getManeuverIcon(step.maneuver);
                const distance = (step.distance / 1000).toFixed(2);
                return `
                    <div class="instruction-item">
                        <div class="instruction-icon">
                            <i class="fas fa-${icon}"></i>
                        </div>
                        <div class="instruction-text">${step.maneuver.instruction || 'आगे बढ़ें'}</div>
                        <div class="instruction-distance">${distance} km</div>
                    </div>
                `;
            }).join('');
        }

        function getManeuverIcon(maneuver) {
            if (!maneuver) return 'arrow-right';
            
            const type = maneuver.type || '';
            if (type.includes('turn')) return 'turn-right';
            if (type.includes('roundabout')) return 'redo';
            if (type.includes('merge')) return 'code-branch';
            if (type.includes('arrive')) return 'flag-checkered';
            return 'arrow-right';
        }

        function showLoading() {
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }
